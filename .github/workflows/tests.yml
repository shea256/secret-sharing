name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install age for interop tests
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python spec/generate_vectors.py --check
      - name: Build both packages
        run: uv build --all-packages
      - name: Core wheel installs with zero dependencies and works
        run: |
          python -m venv "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core/bin/pip" install -q dist/secretsharing-1*.whl
          count=$("$RUNNER_TEMP/core/bin/pip" list --format=freeze --exclude pip --exclude setuptools | wc -l)
          test "$count" -eq 1 || { "$RUNNER_TEMP/core/bin/pip" list; exit 1; }
          printf 'ci secret' > "$RUNNER_TEMP/s.bin"
          "$RUNNER_TEMP/core/bin/secretsharing" create --input "$RUNNER_TEMP/s.bin" --threshold 2 --shares 3 \
            --out "$RUNNER_TEMP/b" --yes --signed
          "$RUNNER_TEMP/core/bin/secretsharing" combine "$RUNNER_TEMP"/b/*share01* "$RUNNER_TEMP"/b/*share03* --stdout \
            | cmp - "$RUNNER_TEMP/s.bin"
