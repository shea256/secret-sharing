name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install age for interop tests
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python spec/generate_vectors.py --check
      - name: Build both packages
        run: uv build --all-packages
      - name: Core wheel imports with no dependencies
        run: |
          python -m venv "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core/bin/pip" install -q dist/secretsharing-*.whl
          "$RUNNER_TEMP/core/bin/pip" freeze | grep -v '^secretsharing==' | grep -v '^$' && exit 1 || true
          "$RUNNER_TEMP/core/bin/secretsharing" --help > /dev/null
